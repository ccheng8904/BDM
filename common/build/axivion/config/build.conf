		</input>

	</action>	
	-->
	<action tool="metric" name="metric" />
	
	<!-- Perform architecture preparation -->
    <action tool="processline" name="processline">
      <input name="rfg" value="$(link:/input[@name='rfg'])" />
      <input name="parameters" type="list">
        <element value="XMI_FILE:$(builtin:confdir)/architecture.xml"/>
      </input>
      <input name="config_file" value="$(builtin:confdir)/processline_config.py" />
      <input name="config_dir"  value="$(builtin:confdir)" />
    </action>	
	
	<!--
    <action tool="architecture_check" name="architecture_check">
      <input name="base_view" value="Declaration Facts" />
      <input name="hierarchy_view" value="File" />
      <input name="architecture_file" value="$(link:/input[@name='architecture_file'])" />
      <input name="mapping_file" value="$(link:/input[@name='mapping_file'])" />
	</action>
	
		
    <action tool="stylecheck" name="stylecheck" teecap_format="axivion" > 
      <input name="ir"  value="$(link:/input[@name='ir'])" /> 
 	  <input name="options" value="-out $(link:/input[@name='analysis_dir'])\$(link:/input[@name='ResultFileNameStylecheck']).txt" />
	</action>


	<action tool="teecap" name="convert_stylecheck" teecap_format="axivion">
	  <input name="infile" value="$(link:/input[@name='analysis_dir'])\$(link:/input[@name='ResultFileNameStylecheck']).txt" />
	  <input name="outfile" value="$(link:/input[@name='teecapdir'])\$(link:/input[@name='ResultFileNameStylecheck']).tee" />
	</action>
	-->
	
	<!-- teecap preparation -->
    <action tool="teecap" name="teecap">
      <input name="format" value="LintFormat" />
      <input name="infile" value="$(env:AXIVION_PATH_OUT)/$(env:AXIVION_VARIANT_NAME).lin" />
      <input name="outfile" value="$(env:AXIVION_PATH_OUT)/$(env:AXIVION_VARIANT_NAME).csv" />
    </action>
	
	
	<action tool="database" name="database">  
	 <input name="dashboard_url" value="http://localhost:9090/axivion" />
     <input name="import_suppressed_issues" value="true" />
	  
      <input name="projectname" value="$(link:/input[@name='projectname'])" />
      <input name="only_violations" value="false" />
      <input name="teecap" type="list">
            <element value="$(env:AXIVION_PATH_OUT)/$(env:AXIVION_VARIANT_NAME).csv" />
      </input>
      <input name="vcs_accounts" type="globbingmap">
        <element key="*" value="__identity__" />
      </input>
      <input name="file_owners" type="globbingmap">
        <element key="$(env:AXIVION_EXCLUDE_PATH)" value="__ignore__" />
      </input>
<!--  
      <input name="metadata" value="sqlite.foreign_keys=1" />
-->
    </action>
	
	<!--
	<action tool="copy_file" name="copy_stylecheck_tee">
	  <input name="source"       value="$(link:/input[@name='teecapdir'])\$(link:/input[@name='ResultFileNameStylecheck']).tee" />
	  <input name="destination"  value="$(link:/input[@name='analysis_dir'])\$(link:/input[@name='ResultFileNameStylecheck'])_saver.tee" />
	</action>
	-->

	
	<action tool="copy_file" name="copy_ir">
      <input name="source"      value="$(link:/input[@name='ir'])" />
      <input name="destination" value="$(link:/input[@name='databasesdir'])/$(link:/input[@name='projectname']).ir" />
    </action>
		
	<action tool="copy_file" name="copy_rfg">
	  <input name="source"       value="$(link:/input[@name='rfg'])" />
	  <input name="destination"  value="$(link:/input[@name='databasesdir'])\$(link:/input[@name='projectname']).rfg" />
	</action>

	
		
	</project>
</config>
