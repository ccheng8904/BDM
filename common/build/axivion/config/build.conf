<?xml version="1.0" encoding="ISO-8859-1"?>
<!DOCTYPE config SYSTEM "continuous.dtd">


<config version="2.2" logging="info">

  <include name="continuous.xml" />

  <!-- driver configuration -->
  
	<driver name="nightly">
		<input name="update_workspace"       value="false" />
		<!-- driver nightly expects environment variables AXIVION_WORKSPACE_DATE and AXIVION_VERSION_NAME to be set -->
		<!--
		<input name="workspace_date"         value="$(env:AXIVION_WORKSPACE_DATE)" />
		<input name="version_name"           value="$(env:AXIVION_VERSION_NAME)" />
        -->
        <!--
		<input name="notification_recipient" value="admin@localhost" />
		<input name="notification_sender"    value="" />
		<input name="notification_server"    value="localhost" />
		<input name="notification_port"      value="25" />
		<input name="notification_username"  value="admin" />
		<input name="notification_password"  value="secret" />
		-->
	</driver>

  <!-- define project -->
  <project name="AxivionBuild" teecap="true" verbose="true">

    <!-- first we define a set of inputs we will use in the project -->
    <input name="driver"            value="nightly" />
    <input name="projectname"       value="$(env:AXIVION_PROJECT_NAME)_$(env:AXIVION_VARIANT_NAME)" />
    <input name="projectdir"        value="$(builtin:confdir)\..\..\..\.." />
<!--    <input name="teecapdir"         value="$(builtin:tempdir)/cibuild-$(builtin:pid)" /> -->
	<input name="analysis_dir"      value="$(builtin:confdir)" />
    <input name="ir"                value="$(env:axivion_ir)" />
    <input name="rfg"               value="$(link:/input[@name='ir']).rfg" />
    <input name="architecture_file" value="$(builtin:confdir)/Architecture.gxl" />
    <input name="mapping_file"      value="$(builtin:confdir)/Mapping.gxl" />
    <input name="databasesdir"      value="$(env:AXIVION_DATABASE_DIR=$(env:AXIVION_DB_PATH_OUT))" />
    <input name="skip_integrity_check"      value="True" />

	
	<vcs name="git">
      <input name="remote" value="origin" />
      <!--<input name="binary" value="$(env:GITPATH)" />-->
      <input name="gitdir" value="$(link:/input[@name='projectdir'])\common\.git"/>
	  <input name="rootpath" value="common" />
      <input name="sourceserver_gitdir" value="$(link:/input[@name='projectdir'])\common\.git"/>
    </vcs> 
	
	
	
	<vcs name="shadow">
      <input name="shadow_directory" value="$(link:/input[@name='databasesdir'])/shadow/$(link:/input[@name='projectname'])" />
    </vcs>
	
	
	
 	<!-- vcs: directory -->
	<vcs name="directory">
		<input name="basedirectory" value="$(env:AXIVION_PROJECT_PATH)" />
		<input name="dateformat"   value="" />
	</vcs>
	
	
 	<!-- database -->
	<database name="sqlite">
      <input name="filename" value="$(link:/input[@name='databasesdir'])\$(env:AXIVION_PROJECT_NAME)_$(env:AXIVION_VARIANT_NAME).db" />
    </database>
	
	<!-- analyses -->
		
	<action tool="ir2rfg" name="ir2rfg">
      <input name="ir"   value="$(link:/input[@name='ir'])" /> 
      <input name="rfg"  value="$(link:/input[@name='rfg'])" />
    </action>
		
	<!--	
    <action tool="stylecheck" name="stylecheck" teecap_format="axivion" > 
      <input name="ir"  value="$(link:/input[@name='ir'])" /> 
 	  <input name="options" value="-out $(link:/input[@name='analysis_dir'])\$(link:/input[@name='ResultFileNameStylecheck']).txt" />
	</action>

			
	<action tool="teecap" name="convert_stylecheck" teecap_format="axivion">
	  <input name="infile" value="$(link:/input[@name='analysis_dir'])\$(link:/input[@name='ResultFileNameStylecheck']).txt" />
	  <input name="outfile" value="$(link:/input[@name='teecapdir'])\$(link:/input[@name='ResultFileNameStylecheck']).tee" />
	</action>
	-->	
    <action tool="stylecheck" name="stylecheck" >
		<input name="options"      value="-j" />
		<input name="excludes" type="list" >
			<element value="$(env:THIRD_PARTY_LIB)" /> 
			<element value="*/wolfssl/*" />
			<element value="*/ble_sdk/*" />
			<element value="*/protobuf_lib/src/*" />
		</input>
    </action>
	
	<action tool="irclones" name="irclones">
		<input name="ir"   value="$(link:/input[@name='ir'])" /> 
		<input name="rfg"  value="$(link:/input[@name='rfg'])" /> 
		<input name="excludes" type="list" >
			<element value="Uses*" />
			<element value="C:\Keil*" />
			<element value="M:*" />
		</input>
		<input name="options" value="--minlines=10 --minweight=5 --type3_similarity=80" />
    </action>

	
	<action tool="cycles" name="cycles" />


	<!-- entries: interrupts and event handler

	<action tool="command" name="fill_entries_view">
      <input name="build_command" value="$(env:BAUHAUS_BIN_PATH)\rfgscript.exe $(builtin:confdir)\fill_entries_view.py" />
      <input name="build_options" value="$(link:/input[@name='rfg']) &quot;\w+IRQHandler.*&quot; &quot;\w+IrqHandler.*&quot; &quot;\w+vHandle\w*Event.*&quot;" />
    </action> -->
    
 	
	
	<!-- entries: interrupts and event handler --> 			
	<action tool="deadcode" name="deadcode">
	    <input name="entries" type="list">
			<element value="R ITBL_vResetHandler()" />
			<element value="R NMI_Handler()" />
			<element value="R HardFault_Handler()" />
			<element value="R MemManage_Handler()" />
			<element value="R BusFault_Handler()" />
			<element value="R UsageFault_Handler()" />
			<element value="R ITBL_vSpuriousIsr()" />
			<element value="R SVC_Handler()" />
			<element value="R DebugMon_Handler()" />
			<element value="R PendSV_Handler()" />
			<element value="R SysTick_Handler()" />
		<!--
			<element value="R WWDG_IRQHandler()" />
			<element value="R PVD_IRQHandler()" />
			<element value="R TAMPER_IRQHandler()" />
			<element value="R RTC_IRQHandler()" />
			<element value="R FLASH_IRQHandler()" />
			<element value="R RCC_IRQHandler()" />
			<element value="R HINT0_vIsrExtiIrqHandler()" />
			<element value="R HINT1_vIsrExtiIrqHandler()" />
			<element value="R HINT2_vIsrExtiIrqHandler()" />
			<element value="R HINT3_vIsrExtiIrqHandler()" />
			<element value="R HINT4_vIsrExtiIrqHandler()" />
			<element value="R DMA1_Channel1_IRQHandler()" />
			<element value="R DMA1_Channel2_IRQHandler()" />
			<element value="R DMA1_Channel3_IRQHandler()" />
			<element value="R DMA1_Channel4_IRQHandler()" />
			<element value="R DMA1_Channel5_IRQHandler()" />
			<element value="R DMA1_Channel6_IRQHandler()" />
			<element value="R DMA1_Channel7_IRQHandler()" />
			<element value="R ADC1_2_IRQHandler()" />
			<element value="R USB_HP_CAN1_TX_IRQHandler()" />
			<element value="R USB_LP_CAN1_RX0_IRQHandler()" />
			<element value="R CAN1_RX1_IRQHandler()" />
			<element value="R CAN1_SCE_IRQHandler()" />
			<element value="R HINT59_vIsrExtiIrqHandler()" />
			<element value="R TIM1_BRK_IRQHandler()" />
			<element value="R TIM1_UP_IRQHandler()" />
			<element value="R TIM1_TRG_COM_IRQHandler()" />
			<element value="R HTIM1_vIsrHandleTimerEvent()" />
			<element value="R HTIM2_vIsrHandleTimerEvent()" />
			<element value="R HTIM3_vIsrHandleTimerEvent()" />
			<element value="R HTIM4_vIsrHandleTimerEvent()" />
			<element value="R I2C1_EV_IRQHandler()" />
			<element value="R I2C1_ER_IRQHandler()" />
			<element value="R I2C2_EV_IRQHandler()" />
			<element value="R I2C2_ER_IRQHandler()" />
			<element value="R HSPI0_vIsrHandleTxRxEvent()" />
			<element value="R HSPI1_vIsrHandleTxRxEvent()" />
			<element value="R HUART0_vIsrHandleRxTxEvent()" />
			<element value="R HUART1_vIsrHandleRxTxEvent()" />
			<element value="R HUART2_vIsrHandleRxTxEvent()" />
			<element value="R HINT1015_vIsrExtiIrqHandler()" />
			<element value="R RTCAlarm_IRQHandler()" />
			<element value="R USB_WKUP_IRQHandler()" />
			<element value="R TIM8_BRK_IRQHandler()" />
			<element value="R TIM8_UP_IRQHandler()" />
			<element value="R TIM8_TRG_COM_IRQHandler()" />
			<element value="R HTIM8_vIsrHandleTimerEvent()" />
			<element value="R ADC3_IRQHandler()" />
			<element value="R FSMC_IRQHandler()" />
			<element value="R SDIO_IRQHandler()" />
			<element value="R HTIM5_vIsrHandleTimerEvent()" />
			<element value="R HSPI2_vIsrHandleTxRxEvent()" />
			<element value="R HUART3_vIsrHandleRxTxEvent()" />
			<element value="R HUART4_vIsrHandleRxTxEvent()" />
			<element value="R HTIM6_vIsrHandleTimerEvent()" />
			<element value="R HTIM7_vIsrHandleTimerEvent()" />
			<element value="R DMA2_Channel1_IRQHandler()" />
			<element value="R DMA2_Channel2_IRQHandler()" />
			<element value="R DMA2_Channel3_IRQHandler()" />
			<element value="R DMA2_Channel4_5_IRQHandler()" />
			

			<element value="R MUARTL_vHandleRxEvent()" />
			<element value="R MUARTL_vHandleTxEvent()" />  
			<element value="R MUART_vHandleRxEvent()" /> 
			<element value="R MUART_vHandleTxEvent()" /> 
			<element value="R TPC_vHandleZeroCrossEvent0Deg()" />  
			<element value="R TPC_vHandleZeroCrossEvent180Deg()" /> 
			<element value="R TZC_vHandleSwitchOffEvent()" />
			<element value="R TZC_vHandleZeroCrossEvent()" /> 
			<element value="R SYC_vHandleEventEdge(ui)@Prog/powersync.c" />  	
		-->			
		</input>
 			
   </action>


	
	<!-- due to Mr. Bellon (Axivion) support meeting on 06.02.2014: for C only fan metric relevant because the others are object oriented metrics -->
	<!--
	<action tool="metric_rfg" name="metric_rfg" >
		<input name="import_view"   value="Module" /> 
		<input name="calculate_fan"   value="true" /> 
		<input name="calculate_coupling"   value="false" /> 
		<input name="calculate_mi"   value="false" /> 
		<input name="calculate_oo"   value="false" /> 
	</action>
	-->

	<!--
	<action tool="metric_filter" name="metric_filter" >
		
		<input name="attributes" type="list" >
		</input>
			
		<input name="all_values" type="list" >
				
			<element value="Metric.Lines.Code" />
			<element value="Metric.Lines.Comment" />
			<element value="Metric.Lines.Empty" />
			<element value="Metric.Lines.Only_Comment" />
			
			<element value="Metric.McCabe_Complexity" />
			<element value="Metric.Extended_McCabe" />
			<element value="Metric.Switch_Complexity" />
			
