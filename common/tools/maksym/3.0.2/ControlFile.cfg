# Just one list may be specified WHITE, CHECK or BLACK, otherwise warning is generated to stderr.
# Lists RENAME or REPLACE may be specified separately or in combination with WHITE or CHECK or BLACK. Symbols may be different.
# Symbols specified in RENAME (or REPLACE) and WHITE, just symbols in WHITE will be processed.
# Symbols specified in RENAME (or REPLACE) and BLACK will not be extracted. No warning is generated.

[WHITE_LIST]
# Just specified symbols will be extracted from executable file (elf, coff).
# Warning is generated on stderr if symbol specified in white list is not present in executable file.
# Symbol name can contain wildcard characters - asterisk sign (*) matches zero or more characters, and the question mark (?) matches a single character.
# [STRUCT|DATA|PROC] Name
Symbol01
Symbol02
Symbol03

[CHECK_LIST]
# Specified symbols must be present in executable file.
# Warning is generated if symbol is not present in executable file.
# Symbol name can not contain wildcard characters.
# [STRUCT|DATA|PROC] Name

[RENAME] 
# Generate a symbol X from symbol Y (symbol Y will not be removed).
# Symbol name can not contain wildcard characters.
# [STRUCT|DATA|PROC] NameOld NameNew
Symbol01 Symbol01_Rename

[REPLACE]
# Generate a symbol X from symbol Y (symbol Y will be removed).
# Symbol name can not contain wildcard characters.
# [STRUCT|DATA|PROC] NameOld NameNew
Symbol02 Symbol02_Replace

[BLACK_LIST]
# Specified symbols will not be written to output symbol file
# Symbol name can contain wildcard characters - asterisk sign (*) matches zero or more characters, and the question mark (?) matches a single character.
# [STRUCT|DATA|PROC] Name
